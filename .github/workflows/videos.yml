name: videos
on:
  schedule:
    # Shorts 4/gün: TR 16:00, 19:00, 22:00, 02:00 (ABD sabah / öğlen / öğleden sonra / akşam)
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"
    # Uzun video Salı/Perşembe/Cumartesi TR 20:00
    - cron: "0 17 * * 2,4,6"
  workflow_dispatch:
    inputs:
      format:
        description: short or long
        type: choice
        options: [short, long]
        default: short
      no_upload:
        description: Render only, do not upload
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev pkg-config
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stickstory
          key: kokoro-v1.0
      - name: Pick format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "f=${{ inputs.format }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 17 * * 2,4,6" ]; then echo "f=long" >> $GITHUB_OUTPUT
          else echo "f=short" >> $GITHUB_OUTPUT; fi
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
          SCRIPT_SOURCE: ${{ vars.SCRIPT_SOURCE }}
        run: python run.py --format ${{ steps.fmt.outputs.f }} ${{ inputs.no_upload && '--no-upload' || '' }}
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/script.json
            output/*/meta.json
            output/*/thumb.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "stickstory-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in history.json published.csv queue; do [ -e "$p" ] && git add "$p" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "video: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
